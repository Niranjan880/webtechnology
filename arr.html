<html>
<head>
<title>ARRAY</title>
<script>
		function dup(arr) 
			{
				return [...new Set(arr)];
			}
			let numb  = [10,40,50,60,80,80,90,70,60,50,10];
			let nudup =dup(numb);
			console.log("ARRAY", numb);
			console.log("NEW ARRAY", nudup);
</script>
</head>
