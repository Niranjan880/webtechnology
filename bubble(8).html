<html>
<head>
    <title>Bubble Sort</title>
</head>
<body>
<h2>Bubble Sort</h2>
<label>Enter numbers</label><br><br>
<input type="text" id="numbers">
<button onclick="sortNumbers()">Sort</button>
<h3 id="result"></h3>
<script>
function bubbleSort(arr)
{
let n = arr.length;
for (let i = 0; i < n - 1; i++)
{
for (let j = 0; j < n - i - 1; j++)
{
if (arr[j] > arr[j + 1])
{
let temp = arr[j];
arr[j] = arr[j + 1];
arr[j + 1] = temp;
}              
}            
}
 return arr;
}
function sortNumbers()
{
let input = document.getElementById("numbers").value;
let arr = input.split(" ");
let sorted = bubbleSort(arr);
document.getElementById("result").innerHTML = "Sorted Array: " + sorted.join(" ");
}
</script>

</body>
</html>
